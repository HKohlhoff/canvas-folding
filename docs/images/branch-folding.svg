<svg xmlns="http://www.w3.org/2000/svg" width="720" height="270" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">Expanded and collapsed Canvas branches</title>
  <desc id="desc">An expanded branch with visible descendants and a collapsed branch whose parent shows a plus control.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#cbd1dc"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#268bd2"/>
    </marker>
    <style>
      .label { font: 600 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #4d5668; }
      .node-text { font: 500 19px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #3f485d; }
      .count { font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #687386; }
      .control { font: 700 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475269; text-anchor: middle; dominant-baseline: central; }
      .control-inverse { font: 700 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
    </style>
  </defs>
  <rect width="960" height="360" rx="18" fill="#f6f7fa"/>
  <rect width="960" height="360" rx="18" fill="url(#grid)"/>

  <text class="label" x="48" y="43">Expanded branch</text>
  <path d="M 237 180 C 278 180 281 112 326 112" fill="none" stroke="#268bd2" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M 237 180 C 278 180 281 248 326 248" fill="none" stroke="#268bd2" stroke-width="4" marker-end="url(#arrow)"/>
  <g>
    <rect x="48" y="138" width="190" height="84" rx="14" fill="#e7f2fa" stroke="#268bd2" stroke-width="3"/>
    <text class="node-text" x="69" y="188">Project</text>
    <circle cx="211" cy="164" r="18" fill="#d4d9e3" stroke="#bdc4d1"/>
    <text class="control" x="211" y="164">−</text>
  </g>
  <g>
    <rect x="329" y="75" width="170" height="74" rx="13" fill="#ffffff" stroke="#8e99aa" stroke-width="2"/>
    <text class="node-text" x="350" y="119">Research</text>
  </g>
  <g>
    <rect x="329" y="211" width="170" height="74" rx="13" fill="#ffffff" stroke="#8e99aa" stroke-width="2"/>
    <text class="node-text" x="350" y="255">Draft</text>
  </g>

  <line x1="528" y1="38" x2="528" y2="322" stroke="#d5d9e2" stroke-width="2"/>
  <text class="label" x="576" y="43">Collapsed branch</text>
  <g>
    <rect x="576" y="138" width="250" height="84" rx="14" fill="#e7f2fa" stroke="#268bd2" stroke-width="3"/>
    <text class="node-text" x="599" y="188">Project</text>
    <circle cx="797" cy="164" r="18" fill="#1f84ad"/>
    <text class="control-inverse" x="797" y="164">+</text>
  </g>
  <text class="count" x="576" y="251">The + reveals the hidden descendants.</text>
</svg>
